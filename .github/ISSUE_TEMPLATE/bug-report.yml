name: "🐛 버그 신고 / Bug report"
description: "AARGrade의 오동작, 안전하지 않은 변경, 잘못된 판정을 신고합니다."
title: "[Bug] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        잘못된 호환성 통과, 불완전한 롤백, 사용자 파일 손상은 특히 중요합니다. 보안 취약점이나 실제 비밀 노출은 공개 이슈 대신 [Security Policy](https://github.com/gay00ung/aargrade/security/policy)를 이용해 주세요.

  - type: input
    id: version
    attributes:
      label: AARGrade 버전
      placeholder: "aargrade v0.1.0-beta.2"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경 / Environment
      description: OS, CPU, 현재/목표 AGP, Gradle, JDK와 프로젝트 DSL을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 실행 명령 / Command
      description: 비밀 값과 사내 경로를 제거한 명령을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 / Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과 / Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 / Reproduction
      description: 가능한 경우 공개 최소 프로젝트나 단계별 재현 방법을 제공해 주세요. 비공개 고객 소스는 올리지 마세요.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 검토한 로그 또는 JSON / Reviewed logs or JSON
      description: 직접 검토해 민감정보를 제거한 부분만 붙이거나 첨부해 주세요.

  - type: checkboxes
    id: safety
    attributes:
      label: 공개 안전 확인 / Publication safety
      options:
        - label: "공개 이슈에 같은 문제가 없는지 검색했습니다. / I searched existing issues."
          required: true
        - label: "공유한 자료에서 비밀·고객 코드·사내 경로를 제거했습니다. / I sanitized all shared material."
          required: true
