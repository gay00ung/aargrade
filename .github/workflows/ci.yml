name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  gradle-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - fixture: gradle-smoke-agp4
            gradle: "6.7.1"
            java: "11"
            platform: "30"
          - fixture: gradle-smoke
            gradle: "9.4.1"
            java: "17"
            platform: "35"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-${{ matrix.platform }}"
      - name: Validate generated host with AGP
        env:
          AARGRADE_GRADLE_BIN: gradle
          AARGRADE_SMOKE_FIXTURE: ${{ matrix.fixture }}
        run: scripts/gradle-smoke.sh
