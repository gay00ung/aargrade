name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Lint GitHub Actions workflows
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Scan reachable vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Validate cross-platform release archives
        if: runner.os == 'Linux'
        run: make release-check

  gradle-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: gradle-smoke-agp4
            gradle: "6.7.1"
            java: "11"
            platform: "30"
          - fixture: gradle-smoke
            gradle: "9.4.1"
            java: "17"
            platform: "35"
          - fixture: upgrade-assistant-repro
            gradle: "7.5"
            java: "17"
            platform: "33"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Set up JDK 17 for Android tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-${{ matrix.platform }}"
      - name: Select matrix JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Validate generated host with AGP
        env:
          AARGRADE_GRADLE_BIN: gradle
          AARGRADE_SMOKE_FIXTURE: ${{ matrix.fixture }}
        run: scripts/gradle-smoke.sh

  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-35"
      - uses: gradle/actions/setup-gradle@v6
      - name: Migrate Kotlin catalog fixture and build its AAR
        run: scripts/migration-smoke.sh

  public-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Run the read-only user demo
        run: make demo
      - name: Validate the public host lifecycle
        run: go test ./tests/integration -run '^TestPublicExampleUserJourney$' -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-35"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the public example AAR
        run: make example-build
      - name: Upload the public example AAR
        uses: actions/upload-artifact@v7
        with:
          name: public-example-aar
          path: examples/library-only/sdk/build/outputs/aar/sdk-release.aar
          if-no-files-found: error

  consumer-matrix:
    needs: public-example
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: agp4-java
            gradle: "6.7.1"
            java: "11"
            platform: "30"
          - cell: agp4-kotlin
            gradle: "6.7.1"
            java: "11"
            platform: "30"
          - cell: agp9-java
            gradle: "9.4.1"
            java: "17"
            platform: "35"
          - cell: agp9-kotlin
            gradle: "9.4.1"
            java: "17"
            platform: "35"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Set up JDK 17 for Android tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-${{ matrix.platform }}"
      - name: Select matrix JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Download the candidate AAR
        uses: actions/download-artifact@v8
        with:
          name: public-example-aar
          path: examples/library-only/sdk/build/outputs/aar
      - name: Build candidate in the consumer cell
        run: >-
          go run ./cmd/aargrade matrix
          --config aargrade.yml
          --cell "${{ matrix.cell }}"
          --java-home "${{ matrix.java }}=$JAVA_HOME"
          --gradle-bin "${{ matrix.gradle }}=gradle"
